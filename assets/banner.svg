<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#07172b" />
      <stop offset="100%" stop-color="#0d1b2a" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 180, 216, 0.07)" stroke-width="1" />
    </pattern>

    <!-- Text Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Node Glow -->
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { r: 4px; opacity: 0.4; }
      50% { r: 8px; opacity: 1; filter: drop-shadow(0 0 6px #00b4d8); }
      100% { r: 4px; opacity: 0.4; }
    }
    @keyframes flow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes wave {
      0% { transform: scale(0.8); opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .grid-bg { fill: url(#grid); }
    .pulse-node { animation: pulse 3s infinite ease-in-out; }
    .flow-line { stroke-dasharray: 8 12; animation: flow 15s linear infinite; }
    .signal-wave { animation: wave 4s ease-out infinite; transform-origin: 1050px 100px; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="400" class="grid-bg" rx="16" />

  <!-- Animated Background Network Graph (Behind Text) -->
  <g stroke="rgba(0, 180, 216, 0.25)" stroke-width="1.5" fill="none">
    <!-- Connecting lines -->
    <path d="M 150 80 Q 300 40 450 100 T 750 60 T 1050 100" class="flow-line" stroke="#00b4d8" stroke-width="2" />
    <path d="M 100 300 Q 350 350 650 280 T 1100 320" class="flow-line" stroke="#7209b7" stroke-width="1.5" />
    <line x1="150" y1="80" x2="220" y2="180" stroke="rgba(0,180,216,0.15)" />
    <line x1="450" y1="100" x2="520" y2="40" stroke="rgba(0,180,216,0.15)" />
    <line x1="750" y1="60" x2="850" y2="140" stroke="rgba(0,180,216,0.15)" />
    <line x1="1050" y1="100" x2="980" y2="220" stroke="rgba(0,180,216,0.15)" />
  </g>

  <!-- Animated Nodes -->
  <g fill="#00b4d8" filter="url(#nodeGlow)">
    <circle cx="150" cy="80" r="5" class="pulse-node" style="animation-delay: 0s;" />
    <circle cx="450" cy="100" r="6" class="pulse-node" style="animation-delay: 0.6s;" fill="#4cc9f0" />
    <circle cx="750" cy="60" r="5" class="pulse-node" style="animation-delay: 1.2s;" />
    <circle cx="1050" cy="100" r="7" class="pulse-node" style="animation-delay: 1.8s;" fill="#f72585" />
    <circle cx="220" cy="180" r="4" class="pulse-node" style="animation-delay: 0.4s;" fill="#7209b7" />
    <circle cx="850" cy="140" r="5" class="pulse-node" style="animation-delay: 1.4s;" fill="#4361ee" />
  </g>

  <!-- Pulse Ring for Gateway Node -->
  <circle cx="1050" cy="100" r="15" fill="none" stroke="#f72585" stroke-width="1.5" class="signal-wave" />

  <!-- Foreground Overlay Shield / Backdrop Box for Maximum Contrast -->
  <rect x="70" y="80" width="1060" height="240" rx="16" fill="rgba(10, 15, 29, 0.75)" stroke="rgba(0, 180, 216, 0.4)" stroke-width="1.5" />

  <!-- Foreground Title and Subtitles (High Contrast & Clear Priority) -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Category Badge -->
    <rect x="440" y="112" width="320" height="32" rx="16" fill="url(#bgGrad)" stroke="#00b4d8" stroke-width="1" />
    <text x="600" y="133" font-size="13" font-weight="700" fill="#4cc9f0" letter-spacing="2">⚡ AWESOME IOT ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="200" font-size="44" font-weight="900" fill="#ffffff" filter="url(#glow)" letter-spacing="0.5">
      IoT Fleet &amp; Device Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="245" font-size="18" font-weight="500" fill="#90e0ef" letter-spacing="0.5">
      Over-the-Air (OTA) Updates • Fleet Orchestration • Remote Telemetry &amp; Monitoring
    </text>

    <!-- Status Tags -->
    <g transform="translate(360, 272)">
      <rect x="0" y="0" width="140" height="26" rx="13" fill="rgba(0, 180, 216, 0.2)" stroke="rgba(0, 180, 216, 0.5)" />
      <text x="70" y="17" font-size="11" font-weight="600" fill="#4cc9f0">🌐 10+ SaaS Platforms</text>

      <rect x="160" y="0" width="160" height="26" rx="13" fill="rgba(114, 9, 183, 0.2)" stroke="rgba(114, 9, 183, 0.5)" />
      <text x="240" y="17" font-size="11" font-weight="600" fill="#c77dff">⚡ 17+ Open-Source Repos</text>

      <rect x="340" y="0" width="140" height="26" rx="13" fill="rgba(247, 37, 133, 0.2)" stroke="rgba(247, 37, 133, 0.5)" />
      <text x="410" y="17" font-size="11" font-weight="600" fill="#f72585">🔒 Production OTA</text>
    </g>
  </g>
</svg>
